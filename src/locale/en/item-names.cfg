[mod-setting-description]
subspace_storage-injector-queue-size=Amount of injectors that will be processed on the tick of injector queue processing.
subspace_storage-extractor-queue-size=Amount of extractors that will be processed on the tick of extractor queue processing.
subspace_storage-combinator-queue-ticks=Setting this to 0 will make all combinators update every time subspace inventory changes.
subspace_storage-combinator-queue-size=Amount of combinators that will be processed on the tick of combinator queue processing.
subspace_storage-electricity-queue-multiplier=Amount of skipped processing ticks between electricity injector/extractor processing.
subspace_storage-inject-call-ticks=If the delay is longer than injector processing queue, the processing will be paused until after the next call. Setting this to 0 will force updates at the end of injector queue.
subspace_storage-extract-call-ticks=Setting this to 0 will force updates at the end of extractor queue.
subspace_storage-recycling-ticks=Sometimes extractors might request more items that they can hold (e.g. its requests changed, or something else placed a item inside). Such items will remain in local storage for future requests, and will be sent back to subspace after this amount of ticks. Setting this to 0 will force updates at the end of extractor queue.
subspace_storage-connection-timeout=If Clusterio doesn't respond for this amount of ticks, all injector and extractor processing stops until it responds again.
subspace_storage-max-items=Stop exporting items after reaching this amount stored (set to 0 to disable limit).
subspace_storage-max-fluid=Stop exporting fluids after reaching this amount stored (set to 0 to disable limit).
subspace_storage-max-electricity=Stop exporting electricity after reaching this amount of MJ stored (set to 0 to disable limit).
subspace_storage-infinity-mode=Make interactors cheat in resources instead of pulling from master storage (useful for testing in single player).

